## Qualidade
- Nenhum `<form>`; use addEventListener e eventos de clique/entrada.
- Use delegação de eventos em listas que são redesenhadas (innerHTML).
- Escape de texto digitado antes de colocar em innerHTML.
- Uso de aspas tipográficas (’ “ ”) nos textos visíveis e `Intl`/`toLocaleString('pt-BR')` para valores em R$.
- Teste mentalmente os fluxos: GS1 → Recebimento → Validar → Liberar → Estoque/Fornecedores/Indicadores; Kanban → Registrar saída → alerta de reposição.
